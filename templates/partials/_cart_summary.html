<aside class="summary-card">
  <h2>Order Summary</h2>
  <div class="summary-line"><span>Subtotal</span><strong>₱{{ subtotal|floatformat:2 }}</strong></div>
  <div class="summary-line"><span>Shipping</span><strong>₱{{ shipping|floatformat:2 }}</strong></div>
  <hr>
  <div class="summary-line total"><span>Total</span><strong>₱{{ total|floatformat:2 }}</strong></div>
  <a class="button full" href="{% url 'checkout' %}">Proceed to Checkout</a>
</aside>
