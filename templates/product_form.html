{% extends "base.html" %}
{% block title %}{{ title }} | ShopEase{% endblock %}
{% block content %}
<div class="form-shell">
  <div class="page-heading"><div><p class="eyebrow">STAFF</p><h1>{{ title }}</h1></div><a class="button secondary" href="{% url 'product_manage' %}">Back</a></div>
  <form method="post" enctype="multipart/form-data"
        hx-post="" hx-target="#product-form" hx-swap="innerHTML" hx-indicator="#form-loading" id="product-form">
    {% include "partials/_product_form.html" %}
  </form>
</div>
{% endblock %}
